<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content">
    <h1>Start</h1>
    <div id="tile">
        <p>:)</p>
    </div>
    </div>
    <div id="loader" hidden="true">
        :)
    </div>
    <style>
        html {
               height: 100%;
        }
        body {
            background-color: rgb(0, 0, 0);
            padding: 0;
            margin: 0;
               height: 100%;
        }
        #content {
            background-color: purple;
            padding: 100px;
            height: 100%;
            animation: sp 0.25s linear;
        }
        #content > h1 {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 100;
            font-size: 50px;
        }
        #tile {
            background-color: red;
            width: 100px;
            height: 100px;
            color: white;
            font-size: 50px;
            animation-delay: 0.25s;
             animation: sp 0.5s linear;
        }
        #loader {
            height: 100%;
            background-color: red;
            height: 100%;
            color: white;
            font-size: 200px;
        }
        #loader:not([hidden]) {
           animation: sp 0.25s linear;
        }
        @keyframes sp {
            0% {
                transform: perspective(500px) rotateY(15deg);
                transform-origin: left;
            }

            100% {
                transform-origin: left;
                transform: perspective(500px) rotateY(0deg);
            }
        }
    </style>
    <script>
        document.getElementById("tile").onclick = function(){
            document.getElementById("content").hidden = true
             document.getElementById("loader").hidden = false
            setTimeout(function(){
                window.location = "./4.html"
            }, 1000)
        }
    </script>
</body>
</html>
