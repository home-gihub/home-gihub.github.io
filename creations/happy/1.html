<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a :)</title>
</head>
<body>
    <div id="outer">
        <div id="inner">
            <label for=":">:</label>
            <input value="1" type="checkbox" id=":"/>
            <br>
            <label for=")">)</label>
            <input value="1" type="checkbox" id=")"/>
            <p id="res"></p>
        </div>
    </div>
    <script>
        chktop = document.getElementById(":")
        chkbot = document.getElementById(")")
        res = document.getElementById("res")

        function assemble(){
            str = " "
            if (chktop.checked) {str+=":"}
            if (chkbot.checked) {str+=")"}
            if (chktop.checked&&chkbot.checked) {
                res.innerHTML = '<a href="./2.html">:)</a>'
            } else {
                
                res.innerHTML = "";
            res.innerHTML = str+" "
        }
        }

        chktop.addEventListener('click', assemble)
        chkbot.addEventListener('click', assemble)
    </script>
    <style>
        body,html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #outer {
            margin: auto;
            height: 100%;
            align-content: center;
            width: fit-content;
        }
        #inner {
            display: inline-block;
            width: 100px;
            height: 100px;
            text-align: center;
            box-shadow: 0px 0px 50px black;
        }
        #res{
            width: 100%;
            text-align: center;
        }
    </style>
</body>
</html>
