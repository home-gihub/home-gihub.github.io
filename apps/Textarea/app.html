<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../applook.css">
</head>
<body>
    <div class="menubar"><button id="fileopen">Open file</button><button id="filesave">Save</button></div>
    <textarea id="doc"></textarea>
    <style>
        #doc {
            resize: none;
            width: 100%;
            height: 100%;
            display: block;
            overflow: scroll;
        }
        body{
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script>
        // Source - https://stackoverflow.com/a/40971885
// Posted by user4602228, modified by community. See post 'Timeline' for change history
// Retrieved 2026-06-29, License - CC BY-SA 4.0

var input = document.createElement('input');
input.type = 'file';

input.onchange = e => { 

   // getting a hold of the file reference
   var file = e.target.files[0]; 

   // setting up the reader
   var reader = new FileReader();
   reader.readAsText(file)

   // here we tell the reader what to do when it's done reading...
   reader.onload = readerEvent => {
      var content = readerEvent.target.result; // this is the content!
      let textarea = document.getElementById("doc")
     textarea.value = content
   }

}

document.getElementById("fileopen").addEventListener('click', function(){
input.click();
})

document.getElementById("filesave").onclick = function(){
        var file = new Blob([document.getElementById("doc").value])
        var a = document.createElement("a"),
                url = URL.createObjectURL(file);
        a.href = url;
        savewnd = window.top.InitWindow(null, "Save as...", true)
        label = document.createElement('label')
        fnamei = document.createElement('input')
        fnamei.type = 'text'
        label.for = fnamei
        label.innerText = 'File name:'
        savebtn = document.createElement('button')
        savebtn.innerText = "Save File"
        savebtn.onclick = function() {
            savewnd.close()
                    a.download = fnamei.value;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);  
        }, 0); 
        }
        savewnd.contentdom.appendChild(label)
        savewnd.contentdom.appendChild(fnamei)
        savewnd.contentdom.appendChild(savebtn)

}

    </script>
</body>
</html>
